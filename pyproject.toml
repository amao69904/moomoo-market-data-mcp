[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moomoo-market-data-mcp"
version = "0.1.0"
description = "Read-only MCP server for real-time moomoo/Futu market data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["futu-api>=9.0", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
moomoo-market-data-mcp = "moomoo_market_data.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moomoo_market_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
